# flow5 spoke settings for the Currawong (tool settings, not aircraft data).
# sweep: the sweep folder in work/flow5/currawong/sweeps/ that gives the data (user statement 2026-10-08:
#   "currawongv5_testfuse is the aircraft for ground truth"). sweep_date: the run date of that sweep (2026-10-04,
#   the old inventory note "run by the Aerolink sweep runner on 2026-10-04"; the export does not record it).
# surfaces: flow5 surface name -> the ADH node. The horizontal tail and the fin are subcomponents of 1.2.2.4.1
#   Stabilizer (ADH has one Stabilizer node).
# mesh: the panel counts of plane_with_body.xml of that sweep, used by `aeroplan generate flow5`.
sweep: currawong_sheetcg
sweep_date: '2026-10-15'
foils: plane
surfaces:
  Main Wing:
    node: 1.2.2.3
    instance: wing_main
  Elevator:
    node: 1.2.2.4.1
    instance: htail
    subcomponent: true
    name: Horizontal tail
  Fin:
    node: 1.2.2.4.1
    instance: fin
    subcomponent: true
    name: Fin
body:
  node: 1.2.2.2
  instance: fuselage
# sweep_runner: `aeroplan sweep flow5 currawong`. Values copied from the polar XML files of currawongv5_testfuse.
#   project: the .fl5 in the work folder (the plane XML names foils; the flap hinges live in the project foils).
#   T6 flaps: flap number -> sign of the deflection range (max_deg). Elevator flaps 1 and 2 move together, the
#   ailerons in opposite directions.
sweep_runner:
  project: Currawongv5_withfuse.fl5
  polar: {method: TRIUNIFORM, thin_surfaces: true, fuselage_moments: true, wake_panels: 5, wake_progression: 1.1, wake_chords: 30}
  ranges: {alpha_deg: [-4, 12, 2], beta_deg: [-8, 8, 2], control_points: 7}
  runs:
  - {name: t7_reference, type: T7}
  - {name: alpha, type: T1}
  - {name: alpha_viscous, type: T1, viscous: true}
  - {name: beta, type: T5}
  - {name: elevator, type: T6, control: elevator, surface: Elevator, flaps: {1: 1, 2: 1}, max_deg: 15}
  - {name: aileron, type: T6, control: aileron, surface: Main Wing, flaps: {1: 1, 2: -1}, max_deg: 15}
  - {name: rudder, type: T6, control: rudder, surface: Fin, flaps: {1: 1}, max_deg: 15}
mesh:
  surfaces:
    Main Wing:
      tip_strips: 20
      sections:
      - x_panels: 10
        x_dist: UNIFORM
        y_panels: 60
        y_dist: UNIFORM
      - x_panels: 10
        x_dist: UNIFORM
        y_panels: 15
        y_dist: UNIFORM
      - x_panels: 10
        x_dist: UNIFORM
        y_panels: 15
        y_dist: UNIFORM
      - x_panels: 10
        x_dist: UNIFORM
        y_panels: 30
        y_dist: UNIFORM
      - x_panels: 10
        x_dist: UNIFORM
        y_panels: 7
        y_dist: UNIFORM
    Elevator:
      tip_strips: 10
      sections:
      - x_panels: 20
        x_dist: TANH
        y_panels: 48
        y_dist: UNIFORM
      - x_panels: 20
        x_dist: TANH
        y_panels: 8
        y_dist: UNIFORM
      - x_panels: 20
        x_dist: TANH
        y_panels: 5
        y_dist: INV_EXP
    Fin:
      tip_strips: 10
      sections:
      - x_panels: 20
        x_dist: TANH
        y_panels: 80
        y_dist: TANH
      - x_panels: 20
        x_dist: TANH
        y_panels: 5
        y_dist: TANH
  body:
    name: Fuselage
    type: FLATPANELS
    x_panels:
    - 2
    - 2
    - 2
    - 2
    - 2
