# CREO spoke settings for the Currawong (tool settings, not aircraft data).
# The CAD exports in work/creo/currawong/cad/ (STL, units mm) and the transform that puts each part into the design
# frame (FRD: x forward, y right, z down, m, origin at the wing root leading edge, ADR 0025). Source of the transforms: the
# retired hand config (AeroPlan package 0.1.0, visual.parts), turned to FRD on 2026-10-21 (x and z change sign). They
# were fitted to the flow5 surfaces:
#   assembly axes [z, -x, -y], no shift (the CAD assembly frame of this export: z forward, y up): 4 to 7 mm median.
#   wing frame (wing, aileron_r): axes [-z, x, -y], origin_m 0.0 (2026-10-15; was 0.0744, a fit to the flow5 wing at x = -0.080).
#     The Creo assembly puts the wing root leading edge at x = 0.000, and the shrinkwrap holds the wing panel there
#     (the skin panel to the CAD wing: see tests of 2026-10-15). User decision: the CAD position is true.
#   aileron_l: the wing frame turned 180 deg about y: axes [z, -x, -y], same origin.
# elevator.stl holds both elevator halves. elevator_l/r.stl and fuseskinshrinkwrap.stl are not parts of the view.
# skins: the outer skin of the fuselage, the Creo shrinkwrap fuseskinshrinkwrap.stp (written 2026-10-04, faceted,
#   unit INCH). Same assembly frame as fuselage.stl, so the same axes. The new CAD standard has x forward, y right, z down; this
#   export is older and keeps its CAD frame. The skin is the reference shape (datum checks,
#   OpenVSP view, OpenVSP panel analysis).
#   body: the spoke slices the skin into the ADH body of the fuselage (aeroplan.skin_body). 41 frames, 37 points each
#   (5 deg ray steps): RMS gap to the skin 0.86 mm, largest 6.5 mm outside the wing panel (scan of y_max_m 0.118 to 0.13
#   and 25 or 37 points, 2026-10-15). The shrinkwrap also holds the centre panel of the CAD wing (x 0.000 to 0.370,
#   |y| to 0.252, z -0.015 to +0.040). cut.x_m is the range of the pod stations that the panel crosses (the skin
#   stations from the wing root leading edge to 80 mm ahead of it and beyond the pod taper start; x forward, so the range is
#   negated and swapped on 2026-10-21), and cut.y_max_m
#   (0.12 m) is the half width above which a hit is a wing hit. The pod half width is 0.115 m.
#   min_height_m: the last 23 mm of the skin (x -0.575 to -0.552) is a corrugated sheet 3 mm thick. No frame can hold it.
#   The body closes at the aft station that is 4 mm tall (measured on the skin), plus 5 mm.
# instance: the ADH item (muas.instance) that the part belongs to.
units: mm
parts:
  fuselage: {file: fuselage.stl, instance: fuselage, axes: [z, -x, -y]}
  wing: {file: wing.stl, instance: wing_main, axes: [-z, x, -y], origin_m: [0.0, 0.0, 0.0]}
  aileron_r: {file: aileron_r.stl, instance: aileron_r, axes: [-z, x, -y], origin_m: [0.0, 0.0, 0.0]}
  aileron_l: {file: aileron_l.stl, instance: aileron_l, axes: [z, -x, -y], origin_m: [0.0, 0.0, 0.0]}
  htail: {file: hstab.stl, instance: htail, axes: [z, -x, -y]}
  elevator: {file: elevator.stl, instance: elevator, axes: [z, -x, -y]}
  rudder: {file: rudder.stl, instance: rudder, axes: [z, -x, -y]}
  gear: {file: gear.stl, instance: airframe, axes: [z, -x, -y]}
  propeller: {file: propeller.stl, instance: prop_cruise, axes: [z, -x, -y]}
skins:
  fuselage:
    file: fuseskinshrinkwrap.stp
    instance: fuselage
    axes: [z, -x, -y]
    body: {frames: 41, points: 37, cut: {x_m: [-0.45, 0.13], y_max_m: 0.12}, min_height_m: 0.004}
# tubes: round tube bodies that the CAD does not hold yet. The tail boom: a subcomponent of 1.2.2.4 Empennage (ADH has
#   no WBS number for a boom; the sheet books its mass under Tail). User data of 2026-10-21 (Creo placement of the boom
#   part): a carbon tube 1375 mm long, 25.4 mm outer and 23.4 mm inner diameter, parallel to the x axis. Its forward end is
#   207.624 mm aft of the wing root leading edge and 20.552 mm below it (FRD: x -0.207624, z +0.020552). The aft end is
#   1375 mm further aft. The ends are two points of the design frame, so the boom no longer follows the fuselage body.
tubes:
  tail_boom:
    node: "1.2.2.4"
    name: Tail boom
    description: Tail boom (carbon tube, 25.4 mm outer and 23.4 mm inner diameter, 1375 mm long)
    radius_m: 0.0127
    inner_radius_m: 0.0117
    p0_m: [-0.207624, 0.0, 0.020552]
    p1_m: [-1.582624, 0.0, 0.020552]
    source: "User 2026-10-21: tail boom 1375 mm long, 25.4 mm outer diameter, 23.4 mm inner diameter, no angle to the origin axes, forward end at 207.624 mm aft of and 20.552 mm below the wing root leading edge (Creo placement point 0.000, -20.552, -207.624 mm)"
    placeholder: false
