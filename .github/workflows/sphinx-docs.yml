# Mirrors Boeing/aircraft-data-hierarchy .github/workflows/sphinx-docs.yml (commit 96179ca):
# build the Sphinx docs on every push and on pull requests to main, deploy to GitHub Pages from main.
# Difference: AeroPlan builds the patched ADH copy first, because the API pages import it.

name: Build and Deploy Documentation

on:
  push:
    branches:
      - '*'  # Trigger on push to any branch
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install .[test,docs]

      - name: Build the patched ADH copy
        run: |
          python scripts/build_adh.py

      - name: Build documentation
        id: build
        run: |
          cd docs
          sphinx-build -M html ./source ./_build

      - name: Upload documentation
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: docs/_build/html

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
