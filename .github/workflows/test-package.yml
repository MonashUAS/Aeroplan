# The CI of AeroPlan (ADR 0030, ADR 0031). Five jobs:
#   lint         ruff and the architecture rules (tests/architecture): fast, and the first to fail on a broken rule
#   test         the full test run in the one-.venv install (pip install -e ".[all]"), Linux and Windows
#   fresh-clone  the install of docs/tutorials/first-day.md on Linux, exactly as a new user runs it
#   notebook     runs the Rosella sizing notebook (weekly, by hand, and on a change of aeroplan/aerosandbox/)
#   duplicates   the duplicate-code report of pylint (report only)
# The ADH steps mirror Boeing/aircraft-data-hierarchy: build the patched ADH, run the upstream ADH tests on it (ADR 0034).

name: Test Package

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 18 * * 0'      # Sunday: the notebook job
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # AP016 compares the schema folder with origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: The architecture rules (each failure names its rule and ADR)
        run: python -m pytest tests/architecture -q

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build the wheel (the package must build)
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install in one environment (AeroPlan, AeroSandbox, the notebooks)
        run: python -m pip install -e ".[sizing,dev]"
      - name: Install Proptimiser (Python 3.12 or newer)
        if: matrix.python-version == '3.12'
        run: python -m pip install -e ".[prop]"
      - name: Build the patched ADH copy
        run: python standards/adh/build_adh.py
      - name: Run the upstream ADH tests on the patched copy
        shell: bash
        run: PYTHONPATH=standards/adh/build/src python -m pytest standards/adh/upstream/tests -q
      - name: Run the tests
        run: python -m pytest -q

  fresh-clone:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The install of docs/tutorials/first-day.md
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -e ".[all]"
          python -m aeroplan doctor
          python -m aeroplan check currawong

  notebook:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(join(github.event.commits.*.modified, ' '), 'aeroplan/aerosandbox/')
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[all]"
      - name: Run the Rosella sizing notebook (the output goes to a scratch folder, the committed file stays)
        # needs the blade files in git
        if: hashFiles('aeroplan/aerosandbox/data/proptimiser/*/designs/*.yaml') != ''
        run: jupyter nbconvert --to notebook --execute aeroplan/aerosandbox/notebooks/rosella_sizing.ipynb --output-dir /tmp/nb --ExecutePreprocessor.timeout=2400

  duplicates:
    needs: lint
    runs-on: ubuntu-latest
    continue-on-error: true       # a report today. It blocks after the clean-up of the roadmap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Duplicate code (pylint R0801, 8 lines or more)
        run: |
          python -m pip install pylint
          pylint --disable=all --enable=duplicate-code --min-similarity-lines=8 aeroplan --ignore-paths='aeroplan/.*/\.venv/.*'
