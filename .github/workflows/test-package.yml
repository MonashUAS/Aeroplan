# Mirrors Boeing/aircraft-data-hierarchy .github/workflows/test-package.yml (commit 96179ca):
# build, install the wheel, install the test extras, run pytest. Same triggers as ADH.
# AeroPlan adds two steps that ADH has no need for: build the patched ADH copy (brief D01),
# and run the upstream ADH tests against it, so a patch can never break an upstream test.

name: Test Package

on:
  push:
    branches:
      - '*'  # Trigger on push to any branch
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build the package
        run: |
          python -m build

      - name: Install the package
        run: |
          python -m pip install dist/*.whl

      - name: Install test dependencies
        run: |
          python -m pip install .[test]

      - name: Build the patched ADH copy
        run: |
          python scripts/build_adh.py

      - name: Run the upstream ADH tests on the patched copy
        run: |
          PYTHONPATH=packages/muas_adh/build/src pytest packages/muas_adh/upstream/tests

      - name: Run tests
        run: |
          pytest
