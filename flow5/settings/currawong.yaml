        x_dist: UNIFORM
        y_panels: 30
        y_dist: UNIFORM
      - x_panels: 10
        x_dist: UNIFORM
        y_panels: 7
        y_dist: UNIFORM
    Elevator:
      tip_strips: 10
      sections:
