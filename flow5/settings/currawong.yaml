        x_dist: TANH
        y_panels: 48
        y_dist: UNIFORM
      - x_panels: 20
        x_dist: TANH
        y_panels: 8
        y_dist: UNIFORM
      - x_panels: 20
        x_dist: TANH
        y_panels: 5
        y_dist: INV_EXP
    Fin:
      tip_strips: 10
